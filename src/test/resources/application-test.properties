# Used only when a test says @ActiveProfiles("test").
# It points to a SEPARATE database, so your real "securebank" data is never touched.

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/securebank_test?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:deepu@123}
spring.datasource.hikari.maximum-pool-size=20

# Create the tables in the test database from schema-test.sql (it has no USE statement).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
