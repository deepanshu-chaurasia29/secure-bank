# ---- Server ----
server.port=${PORT:8080}

# ---- Database (falls back to local MySQL if env vars are not set) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securebank}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:deepu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql automatically on startup (only while developing;
# switch this off once the schema is stable and used manually)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---- JWT ----
# NEVER commit a real secret. Set JWT_SECRET as an environment variable.
# This default is only so the app can start locally without extra setup.
app.jwt.secret=${JWT_SECRET:change-this-local-only-secret-please-32chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRY_MIN:30}

# ---- Logging (never log passwords or tokens) ----
logging.level.org.springframework.jdbc.core=INFO
