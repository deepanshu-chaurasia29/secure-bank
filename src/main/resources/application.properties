# ---- Server ----
server.port=${PORT:8080}

# ---- MySQL datasource: set DB_URL, DB_USER and DB_PASSWORD in your run configuration or environment ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securebank?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep local schema bootstrap enabled by default. On an existing production database,
# set DB_SCHEMA_INIT_MODE=never after confirming the tables exist.
spring.sql.init.mode=${DB_SCHEMA_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

# ---- JWT ----
# Set JWT_SECRET in your run configuration or environment. The fallback is local-only;
# the Docker image requires a custom secret before it will start.
app.jwt.secret=${JWT_SECRET:change-this-local-only-secret-please-32chars-min}
app.jwt.expiration-minutes=${JWT_EXPIRY_MIN:30}

# ---- Logging (never log passwords or tokens) ----
logging.level.org.springframework.jdbc.core=INFO

# ---- Business limits (SRS Section 8). Change here, no code change needed. ----
bank.limits.min-amount=${BANK_MIN_AMOUNT:1.00}
bank.limits.max-deposit=${BANK_MAX_DEPOSIT:100000.00}
bank.limits.max-withdraw=${BANK_MAX_WITHDRAW:50000.00}

bank.limits.max-transfer=${BANK_MAX_TRANSFER:100000.00}
bank.limits.daily-transfer=${BANK_DAILY_TRANSFER:200000.00}


# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# ---- Health check: show ONLY the health URL, and no details ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never


# ---- Render deployment settings ----
# Behind Render's HTTPS proxy: trust the X-Forwarded-* headers
server.forward-headers-strategy=framework
# Small connection pool: the free cloud database allows only a few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
