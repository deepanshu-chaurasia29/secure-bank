<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank - Sprint 1</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>SecureBank (Sprint 1: Register / Login)</h1>

  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="regFullName" placeholder="Full name" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="text" id="regPhone" placeholder="Phone (10 digits)" required>
    <input type="date" id="regDob" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <select id="regAccountType">
      <option value="SAVINGS">Savings</option>
      <option value="CURRENT">Current</option>
    </select>
    <button type="submit">Register</button>
  </form>

  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <pre id="output"></pre>

  <script src="/js/app.js"></script>
</body>
</html>
