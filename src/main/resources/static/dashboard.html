<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureBank - Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="wide">
  <header class="top">
    <h1>SecureBank</h1>
    <button id="logoutBtn" class="secondary">Logout</button>
  </header>
  <p class="notice">Demo project. All money here is demo money.</p>

  <section class="card">
    <h2>My Account</h2>
    <div id="accountInfo">Loading...</div>
  </section>

  <section class="card">
    <h2>Deposit / Withdraw</h2>
    <form id="moneyForm">
      <input type="number" id="amount" step="0.01" min="1" placeholder="Amount (e.g. 500.00)" required>
      <input type="text" id="remark" maxlength="255" placeholder="Remark (optional)">
      <div class="row">
        <button type="submit" id="depositBtn" data-action="deposit">Deposit</button>
        <button type="submit" id="withdrawBtn" data-action="withdraw" class="secondary">Withdraw</button>
      </div>
    </form>
    <p id="message"></p>
  </section>

  <section class="card">
    <h2>Transaction History</h2>
    <div class="filters">
      <select id="fType">
        <option value="">All types</option>
        <option value="DEPOSIT">Deposit</option>
        <option value="WITHDRAW">Withdraw</option>
        <option value="TRANSFER_OUT">Transfer out</option>
        <option value="TRANSFER_IN">Transfer in</option>
      </select>
      <input type="date" id="fFrom">
      <input type="date" id="fTo">
      <button id="applyFilters" class="secondary">Apply</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Remark</th></tr>
        </thead>
        <tbody id="historyBody"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prevBtn" class="secondary">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" class="secondary">Next</button>
    </div>
  </section>

  <script src="/js/dashboard.js"></script>
</body>
</html>
