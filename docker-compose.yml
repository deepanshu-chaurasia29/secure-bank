# Starts MySQL + the app together:  docker compose up --build
# It reads its secrets from a file called ".env" (copy .env.example to .env and fill it in).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      MYSQL_DATABASE: securebank
    ports:
      - "3307:3306"   # port 3307 on your PC, so it does not clash with a MySQL already using 3306
    volumes:
      - securebank-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # wait until MySQL is really ready
    environment:
      DB_URL: jdbc:mysql://db:3306/securebank   # "db" is the name of the service above
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DB_SCHEMA_INIT_MODE: ${DB_SCHEMA_INIT_MODE:-always}
    ports:
      - "8080:8080"

volumes:
  securebank-db:
